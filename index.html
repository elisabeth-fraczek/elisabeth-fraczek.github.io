<!doctype html>
<html lang="de">
  <head>
    <!-- Grundeinstellungen und Beschreibung der Seite -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="robots" content="noindex,nofollow,noarchive">
    <meta
      name="description"
      content="Dr. Elisabeth Fraczek — Physik, Datenanalyse und wissenschaftliche Zusammenarbeit."
    >

    <!-- Titel im Browser-Tab -->
    <title>Dr. Elisabeth Fraczek</title>

    <style>
      /* Grundlayout und Farben */
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #fbfaf6;
        color: #142e37;
        font: 16px/1.8 system-ui,-apple-system,'Segoe UI',sans-serif;
      }

      main {
        width: min(760px,calc(100% - 48px));
        margin: 14vh auto 60px;
      }

      /* Themenzeile, Name und Profiltext */
      .eyebrow {
        text-transform: uppercase;
        letter-spacing: .16em;
        font-size: 11px;
        color: #14766a;
      }

      h1 {
        font: clamp(42px,7vw,72px)/1.12 Georgia,serif;
        letter-spacing: -.04em;
        margin: 24px 0;
      }

      p {
        max-width: 580px;
        color: #53666a;
      }

      /* Kontaktlinks */
      nav {
        display: flex;
        gap: 24px;
        flex-wrap: wrap;
        margin-top: 32px;
      }

      a {
        color: #142e37;
        text-underline-offset: 5px;
      }

      a:focus-visible {
        outline: 3px solid #14766a;
        outline-offset: 5px;
      }

      /* Fußzeile */
      footer {
        border-top: 1px solid #d8dfda;
        margin-top: 65px;
        padding-top: 20px;
        font-size: 11px;
        color: #53666a;
      }
    </style>
  </head>

  <body>
    <main>
      <!-- Themenzeile: Hier kannst du deine Schwerpunkte ändern. -->
      <div class="eyebrow">Physik · Daten · Wissenschaft</div>

      <!-- Name und Kurzprofil: Diesen Text kannst du direkt bearbeiten. -->
      <h1>Dr. Elisabeth Fraczek</h1>

      <p>
        Promovierte Physikerin mit Erfahrung in experimenteller Optik,
        quantitativer Messdatenanalyse und technischer Projektkoordination.
      </p>

      <!-- Kontakt: E-Mail-Adresse und LinkedIn-URL stehen jeweils im href-Attribut. -->
      <nav aria-label="Kontakt">
        <a href="mailto:elisabeth.fraczek@proton.me">
          Kontakt per E-Mail
        </a>

        <a
          href="https://www.linkedin.com/in/elisabeth-fraczek"
          rel="noopener noreferrer"
          target="_blank"
        >
          LinkedIn ↗
        </a>
      </nav>

      <!-- Fußzeile: Bezeichnung und Datum kannst du hier anpassen. -->
      <footer>Persönliche Website · Oktober 2026</footer>
    </main>
  </body>
</html>
